[project]
name = "routine"
version = "0.1.0"
description = "Add your description here"
dependencies = [
    "pymupdf>=1.24.10",
    "fitz>=0.0.1.dev2",
    "frontend>=0.0.3",
    "tools>=0.1.9",
    "matplotlib>=3.9.2",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/routine"]
